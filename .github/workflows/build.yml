name: Build and package
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the version in CMakeLists.txt after all packages pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: >-
          dnf install -y git cmake ninja-build gcc-c++ python3 pkgconf-pkg-config
          qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qttools-devel
          kf6-kglobalaccel-devel kf6-kstatusnotifieritem-devel libkscreen-devel
          libddcutil-devel dbus-daemon desktop-file-utils appstream
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Test and validate metadata
        run: |
          dbus-run-session -- ctest --test-dir build --output-on-failure
          desktop-file-validate resources/com.brightless.Brightless.desktop
          appstreamcli validate --no-net resources/com.brightless.Brightless.metainfo.xml
      - name: Install and smoke test
        run: |
          cmake --install build --prefix "$PWD/stage"
          dbus-run-session -- python3 tests/app_smoke_test.py stage/bin/brightless
          cd build && cpack -G ZIP
      - uses: actions/upload-artifact@v4
        with:
          name: brightless-linux-x86_64
          path: build/brightless-*.zip

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true
      - name: Build (MSVC release optimization and LTO)
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Deploy Qt
        run: cmake --install build --config Release --prefix "$pwd/stage"
      - name: Smoke test installed application
        run: |
          # Remove Qt's development bin directory: the installed app must use deployed DLLs/plugins.
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notlike "*$env:QT_ROOT_DIR*" }) -join ';'
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML_IMPORT_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          python tests/app_smoke_test.py stage/bin/brightless.exe
      - name: Package
        working-directory: build
        run: cpack -C Release -G ZIP
      - uses: actions/upload-artifact@v4
        with:
          name: brightless-windows-x86_64
          path: build/brightless-*.zip

  docker-packages:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        format: [debian, fedora, arch, flatpak]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source archive
        run: |
          mkdir -p build/release/source build/release/assets
          git archive HEAD | tar -x -C build/release/source
      - name: Build Docker image
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          image=$FORMAT
          if [ "$image" = flatpak ]; then image=fedora; fi
          docker build -t brightless-package -f "packaging/Dockerfile.$image" packaging
      - name: Build, install and smoke test packages
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          options=()
          script="bash /src/packaging/build.sh $FORMAT"
          if [ "$FORMAT" = flatpak ]; then
            # Bubblewrap needs mount namespaces inside this disposable container.
            options=(--cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined)
            script="bash /src/packaging/flatpak.sh"
          fi
          docker run --rm "${options[@]}" \
            -v "$PWD/build/release/source:/src:ro" \
            -v "$PWD/build/release/assets:/out" \
            brightless-package $script
      - uses: actions/upload-artifact@v4
        with:
          name: brightless-packages-${{ matrix.format }}
          path: build/release/assets/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: [linux, windows, docker-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify artifacts and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tests/release_test.py
          python3 packaging/release.py artifacts
