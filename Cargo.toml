[package]
name = "brightless"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "DDC brightness control for external monitors"
authors = ["Brightless"]
rust-version = "1.92"

[dependencies]
cxx = { version = "1", optional = true }
cxx-qt = { version = "0.9.1", optional = true }
cxx-qt-lib = { version = "0.9.1", features = ["qt_gui", "qt_qml", "qt_quickcontrols"], optional = true }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"], optional = true }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"], optional = true }
glib = { version = "0.22", optional = true }
ddc = "0.2"
ddc-i2c = { version = "0.2", features = ["with-linux", "with-linux-enumerate"] }
i2c-linux = "0.1"
libc = "0.2"
thiserror = "2"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cxx-qt-build = { version = "0.9.1", optional = true }

[features]
default = []
qt = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib", "dep:cxx-qt-build"]
gtk = ["dep:gtk", "dep:adw", "dep:glib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
