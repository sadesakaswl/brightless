[package]
name = "brightless"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "DDC brightness control for external monitors"
authors = ["Brightless"]
rust-version = "1.77"

[dependencies]
cxx = "1"
cxx-qt = "0.9.1"
cxx-qt-lib = "0.9.1"
ddc = "0.2"
ddc-i2c = { version = "0.2", features = ["with-linux", "with-linux-enumerate"] }
i2c-linux = "0.1"
libc = "0.2"
thiserror = "2"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.9.1"

[features]
default = []
